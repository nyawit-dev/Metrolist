name: JVM Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        default: 'v1.0.0'
        type: string
      tag:
        description: 'GitHub Release tag to attach artifacts'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: jvm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x gradlew
      - name: Build JVM artifact
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:packageUberJarForCurrentOS --stacktrace
      - name: Collect JAR
        shell: bash
        run: |
          mkdir -p dist
          find desktopApp/build -type f -name '*.jar' -size +1M -exec cp {} dist/ \;
          test -n "$(ls dist/* 2>/dev/null)" || { echo "::error::No JVM artifact"; exit 1; }
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: jvm-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist/
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
